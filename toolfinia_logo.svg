<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Texture Gradients (Dark Faceted Charcoal Surface) -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="45%" stop-color="#111620"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </radialGradient>

    <!-- Metallic Brushed Silver / Chrome Gradients -->
    <linearGradient id="silverHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e9eef5"/>
      <stop offset="45%" stop-color="#b0bccd"/>
      <stop offset="60%" stop-color="#6e7d91"/>
      <stop offset="80%" stop-color="#9aa7ba"/>
      <stop offset="100%" stop-color="#3a4452"/>
    </linearGradient>

    <linearGradient id="silverFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="metalRimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="35%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Cast Shadows -->
    <filter id="shadow3D" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="-2" dy="-2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>

    <filter id="textShadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="5" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Faceted Charcoal Texture Background (Same as uploaded image) -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle Geometric Facets / Triangular Panel Lines in Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" fill="none">
    <path d="M 0 0 L 400 340 L 800 0"/>
    <path d="M 0 400 L 400 340 L 800 400"/>
    <path d="M 0 800 L 400 340 L 800 800"/>
    <path d="M 400 0 L 400 800"/>
    <path d="M 120 0 L 400 340 L 680 0"/>
    <path d="M 0 200 L 400 340 L 0 600"/>
    <path d="M 800 200 L 400 340 L 800 600"/>
  </g>

  <!-- ==================== 3D METALLIC EMBLEM ==================== -->
  <g filter="url(#shadow3D)">
    
    <!-- Outer Bevel Extrusion Rim (Dark base under metallic plate) -->
    <g fill="#1a1e26" stroke="#2a3240" stroke-width="3">
      <!-- Outer circular rim base -->
      <path d="M 390 145 C 265 145 165 245 165 370 C 165 495 265 595 390 595 C 515 595 615 495 615 370 C 615 245 515 145 390 145 Z"/>
    </g>

    <!-- LEFT HEMISPHERE: GLOBE MESH WITH LETTER "T" -->
    <!-- Globe Outer Arc Left -->
    <path d="M 385 160 
             C 275 160 185 250 185 365 
             C 185 480 275 570 385 570 
             L 385 530 
             C 295 530 225 455 225 365 
             C 225 275 295 200 385 200 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2.5"/>

    <!-- Left Top Gear Tooth on the Globe Arc -->
    <path d="M 270 195 L 290 155 L 340 165 L 330 205 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>

    <!-- Central Vertical Pillar of the "T" Monogram -->
    <path d="M 360 160 L 395 160 L 395 570 L 360 570 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="3"/>

    <!-- Globe Inner Meridian Longitude Rib (Curved Left) -->
    <path d="M 360 200 
             C 280 230 245 300 245 365 
             C 245 430 280 500 360 530 
             L 360 495 
             C 305 465 280 415 280 365 
             C 280 315 305 265 360 235 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2"/>

    <!-- Globe Latitude Bar 1 (Upper Horizontal Rib) -->
    <path d="M 235 275 L 360 275 L 360 250 L 255 250 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>

    <!-- Globe Latitude Bar 2 (Equator Rib) -->
    <path d="M 195 365 L 360 365 L 360 345 L 195 345 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2"/>

    <!-- Globe Latitude Bar 3 (Lower Horizontal Rib) -->
    <path d="M 235 455 L 360 455 L 360 480 L 255 480 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>


    <!-- RIGHT HEMISPHERE: GEAR RIM & WINGED MONOGRAM "F" -->
    <!-- Gear Outer Arch Connecting Teeth -->
    <path d="M 405 195 C 495 195 565 265 565 365 C 565 465 495 535 405 535 L 405 570 C 515 570 605 480 605 365 C 605 250 515 160 405 160 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2.5"/>

    <!-- Gear Teeth (Distinct 5 mechanical teeth extending outwards) -->
    <!-- Tooth 1 (Top-Right) -->
    <path d="M 435 162 L 465 145 L 490 180 L 465 195 Z" fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>
    <!-- Tooth 2 (Upper-Right) -->
    <path d="M 520 205 L 560 220 L 550 260 L 515 245 Z" fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>
    <!-- Tooth 3 (Middle-Right) -->
    <path d="M 565 335 L 610 350 L 605 395 L 565 385 Z" fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>
    <!-- Tooth 4 (Lower-Right) -->
    <path d="M 535 465 L 565 500 L 530 530 L 505 500 Z" fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>
    <!-- Tooth 5 (Bottom-Right) -->
    <path d="M 445 540 L 460 580 L 420 588 L 415 548 Z" fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2"/>

    <!-- Vertical Stem of the "F" Monogram -->
    <path d="M 405 165 L 435 165 L 435 565 L 405 565 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="3"/>

    <!-- Top Wing Blade of "F" (Sweeping Aerodynamic Wing with Feathers) -->
    <path d="M 435 220 
             L 575 220 
             C 595 220 590 250 560 260 
             L 490 275 
             L 540 285 
             C 560 290 550 315 525 320 
             L 435 330 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2.5"/>

    <!-- Lower Wing Feather of "F" -->
    <path d="M 435 365 
             L 515 365 
             C 535 365 530 395 505 405 
             L 435 415 Z" 
          fill="url(#silverHighlight)" stroke="url(#bevelLight)" stroke-width="2.5"/>

    <!-- Inner Core Mechanical Cavity (Depth Groove) -->
    <path d="M 435 440 L 480 440 C 495 445 490 465 470 470 L 435 475 Z" 
          fill="url(#silverFace)" stroke="url(#bevelLight)" stroke-width="2"/>
  </g>

  <!-- ==================== 3D METALLIC TYPOGRAPHY ==================== -->
  <!-- "TOOLFINIA" in Bold Beveled Metallic Brushed Silver/Gold Rim -->
  <g filter="url(#textShadow3D)">
    <!-- Base 3D Extrusion Shadow Behind Text -->
    <text x="400" y="678" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="9" 
          text-anchor="middle" 
          fill="#0c1017">
      TOOLFINIA
    </text>

    <!-- Metallic Rim / Bevel Stroke -->
    <text x="400" y="675" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="9" 
          text-anchor="middle" 
          fill="none" 
          stroke="url(#bevelLight)" 
          stroke-width="3">
      TOOLFINIA
    </text>

    <!-- Front Metallic Brushed Silver Surface -->
    <text x="400" y="675" 
          font-family="'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
          font-size="68" 
          font-weight="900" 
          letter-spacing="9" 
          text-anchor="middle" 
          fill="url(#silverHighlight)">
      TOOLFINIA
    </text>

    <!-- "GLOBAL DIGITAL MARKETPLACE" Subtitle in Crisp Metallic Silver -->
    <text x="400" y="725" 
          font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" 
          font-size="20" 
          font-weight="700" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="#94a3b8">
      GLOBAL DIGITAL MARKETPLACE
    </text>
  </g>
</svg>
